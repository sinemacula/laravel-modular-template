# ==============================================================================
# TESTS
# ==============================================================================
name: Tests

# ==============================================================================
# TRIGGERS
# ==============================================================================
on:
    push:
        branches: [ master ]
    pull_request:
        types: [ opened, synchronize, reopened, ready_for_review ]
    workflow_dispatch:

# ==============================================================================
# CONCURRENCY
# ==============================================================================
concurrency:
    group: tests-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

# ==============================================================================
# PERMISSIONS
# ==============================================================================
permissions:
    contents: read
    id-token: write

# ==============================================================================
# DEFAULTS
# ==============================================================================
defaults:
    run:
        shell: bash

jobs:

    # ==========================================================================
    # JOB: PHP TESTS
    # ==========================================================================
    php:
        name: Test / PHP ${{ matrix.php }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: [ 8.3, 8.4, 8.5 ]

        steps:
            -   name: Checkout
                uses: actions/checkout@v5
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: sinemacula/.github/.github/actions/setup-php@v1.1.1
                with:
                    php-version: ${{ matrix.php }}

            -   name: Prepare application
                run: |
                    cp .env.example .env
                    php artisan key:generate

            -   name: PHPUnit
                run: composer test:coverage

            # The deploy command caches config, routes, events, views and the
            # module map. Nothing else in the pipeline runs it, so a failure
            # here would only ever surface on a deploy. Not paired with
            # optimize:clear, which clears the cache store and so needs a
            # migrated database this job has no reason to create.
            -   name: Optimize
                run: php artisan optimize

            -   name: Publish code coverage
                if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.php == '8.3' }}
                uses: qltysh/qlty-action/coverage@v2
                with:
                    oidc: true
                    files: clover.xml
