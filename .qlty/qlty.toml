# Reference: https://qlty.sh/d/qlty-toml
#
# Code-quality configuration for both the Qlty CLI and Qlty Cloud. Lint and
# format rules come from the shared sinemacula/coding-standards source; this
# file wires that source in and selects the plugins relevant to a Laravel
# application repository.
config_version = "0"

exclude_patterns = [
    "*_min.*",
    "*-min.*",
    "*.min.*",
    "**/build/**",
    "**/cache/**",
    "**/coverage/**",
    "**/dist/**",
    "**/node_modules/**",
    "**/vendor/**",
    ".claude/**",
    ".qlty/configs/**",
    ".sinemacula/**",
    # Framework runtime directory. Holds compiled views, logs and session files
    # written at runtime rather than anything authored in this repository.
    "storage/**",
]

test_patterns = [
    "**/test/**",
    "**/tests/**",
    "**/spec/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/*_test.*",
    "**/*_spec.*",
    "**/test_*.*",
    "**/spec_*.*",
]

[runtimes.enabled]
php = "8.3"

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[source]]
name = "sinemacula"
repository = "https://github.com/sinemacula/coding-standards"
tag = "v1.24.0"

[[plugin]]
name = "actionlint"

# Application repository, so a tracked .env.example defines the environment
# contract every consumer copies. Not present in the package repositories.
[[plugin]]
name = "dotenv-linter"
mode = "comment"

[[plugin]]
name = "editorconfig-checker"

[[plugin]]
name = "markdownlint"
mode = "comment"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "php-codesniffer"
version = "4.0.4"
mode = "comment"
package_file = ".qlty/configs/composer.json"
package_filters = ["slevomat", "dealerdirect", "sinemacula"]

# The fixer config builds its rules from the standards package, which the
# sandbox gets from extra_packages rather than a package_file - setting
# package_file makes qlty ignore extra_packages and the Symfony pins with it.
# Symfony is held below 8 because php-cs-fixer has accepted it since 3.90.0, it
# needs PHP 8.4.1, and the sandbox install ignores the platform requirement.
[[plugin]]
name = "php-cs-fixer"
version = "3.95.25"
extra_packages = [
    "sinemacula/coding-standards@1.24.0",
    "symfony/console@^7.4",
    "symfony/event-dispatcher@^7.4",
    "symfony/filesystem@^7.4",
    "symfony/finder@^7.4",
    "symfony/options-resolver@^7.4",
    "symfony/process@^7.4",
    "symfony/stopwatch@^7.4",
    "symfony/string@^7.4",
]

[[plugin]]
name = "phpstan"
version = "2.1.46"
package_file = ".qlty/configs/composer.json"
package_filters = ["phpstan", "larastan", "sinemacula"]

[[plugin]]
name = "radarlint-php"
mode = "comment"

[[plugin]]
name = "trivy"
drivers = [
    "config",
    "fs-vuln",
]

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "yamllint"

# phpstan resolves framework symbols by autoloading the application's own
# dependencies, which a bare checkout does not have, so install them first.
# COMPOSER_VENDOR_DIR is pinned to the repository's vendor directory because
# the plugin environment points it at the shared phpstan tool sandbox, where an
# install would replace the pinned analysis stack. Only extension requirements
# are ignored so the PHP version constraint still applies.
[plugins.definitions.phpstan.drivers.lint]
prepare_script = "COMPOSER_VENDOR_DIR=vendor ~/.qlty/cache/tools/composer/generic-42cc848a9f5e/composer.phar install --no-scripts --ignore-platform-req='ext-*'"

# php-codesniffer 4.x exits with code 3 when it finds issues; qlty's default
# success codes are [0, 1], so without this qlty treats a normal "issues found"
# run as a hard failure and silently drops every phpcs finding (false green).
# This must live here in the consumer's qlty.toml - a qlty bug drops all of a
# source's exported configs if the block is placed in the shared source.toml.
[plugins.definitions.php-codesniffer.drivers.lint]
success_codes = [0, 1, 2, 3]

# Skip radarlint smell analysis on the test tree. Reused fixture literals and
# multi-branch data providers trip duplication and return-count rules without
# value.
[[exclude]]
plugins = ["radarlint-php"]
file_patterns = ["tests/**"]

# Framework scaffolding, shipped by Laravel and kept close to upstream so it can
# be diffed against a new skeleton on upgrade. It follows Laravel's own
# conventions rather than this organisation's PHP standard, so the style and
# analysis plugins skip it. Security, secret and dependency scanning still
# apply, because those are not style opinions.
[[exclude]]
plugins = [
    "editorconfig-checker",
    "php-codesniffer",
    "php-cs-fixer",
    "phpstan",
    "radarlint-php",
]
file_patterns = [
    "bootstrap/**",
    "config/**",
    "public/**",
]
